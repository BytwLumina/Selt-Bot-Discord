name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Smoke tests
        run: npm test

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Build web panel
        run: npm run build:web
